      <path d="M0,0 L10,5 L0,10 Z" fill="#176b72"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b9294"/>
    </marker>
    <marker id="arrowThin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60777b"/>
    </marker>
    <clipPath id="mapClip">
      <rect x="60" y="156" width="1010" height="646" rx="22"/>
    </clipPath>
