<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">羊卓雍措路线决策：经典G349主线与东岸舍弃线</title>
  <desc id="desc">按经纬度比例绘制的羊卓雍措路线决策图。经典G349主线依次经过1号、2号、3号观景台和浪卡子；喀庆拉、鲁日拉、日托寺所在东岸线路置灰并标为本次不走。拉萨出发走东岸净增约149.4公里，泽当出发净增约132.0公里，预计额外驾驶3.5至4.5小时。</desc>
  <metadata>
    POI positions: AMap GCJ-02, checked 2026-08-28. Road geometry: OSRM/OpenStreetMap after coordinate conversion to WGS84. The lake silhouette is schematic. This figure is not a navigation map and does not establish current access, parking legality, opening hours, fees, or traffic conditions.
  </metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#edf4f1"/>
    </linearGradient>
    <linearGradient id="mainCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f4f2"/>
      <stop offset="1" stop-color="#f8fbf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17353a" flood-opacity="0.14"/>
