  <!-- Decision panel -->
  <g filter="url(#shadow)">
    <rect x="1098" y="156" width="438" height="646" rx="22" fill="#fffdf8" stroke="#d8e0dc"/>
  </g>
  <text class="cn eyebrow" x="1130" y="197">EXECUTION CALL</text>
  <text class="cn panelTitle" x="1130" y="230">当天只做一件事</text>
  <text class="cn body" x="1130" y="258">把羊湖主观景窗留在顺路西线，</text>
  <text class="cn body" x="1130" y="282">并在天黑前抵达日喀则。</text>

  <g transform="translate(1125 308)">
