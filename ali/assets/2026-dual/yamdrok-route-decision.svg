    <text class="cn metric" x="218" y="149">+149.4 km</text>
    <text class="cn metricLabel" x="18" y="181">B｜泽当出发净增</text>
    <text class="cn metric" x="218" y="184">+132.0 km</text>
    <text class="cn" x="18" y="213" font-size="15" font-weight="740" fill="#a94f36">预计额外驾驶 3.5–4.5 小时</text>
  </g>

  <g transform="translate(1125 729)">
    <circle cx="11" cy="10" r="10" fill="#f0a33a"/>
    <text class="cn" x="11" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">!</text>
    <text class="cn" x="30" y="15" font-size="14" font-weight="720" fill="#644f45">东岸只适合另排独立羊湖日</text>
    <text class="cn tiny" x="30" y="38">额外驾驶之外，还要计停车、观景与日托寺步行。</text>
  </g>

  <!-- Evidence and coordinate-system boundary. -->
  <g transform="translate(64 833)">
    <rect width="1472" height="104" rx="18" fill="#24383d"/>
    <text class="cn" x="26" y="30" font-size="14" font-weight="760" fill="#d9ece9">数据边界</text>
    <text class="cn" x="26" y="56" font-size="13" fill="#d8e3e1">点位由高德 POI（GCJ-02）核验；道路折线由同点转换至 WGS84 后交给 OSRM 计算。两套坐标不可直接混用。</text>
    <text class="cn" x="26" y="80" font-size="13" fill="#bfcfcd">线形用于路线取舍，不替代导航，也不证明实时开放、收费、停车容量或停车合法性。版本：2026-08-28；临行前7天、72小时、前一晚复核。</text>
