      .mutedLabel { font-size: 15px; font-weight: 700; fill: #6f7779; paint-order: stroke; stroke: #fffdf8; stroke-width: 5px; stroke-linejoin: round; }
      .metric { font-size: 29px; font-weight: 780; fill: #a94f36; }
      .metricLabel { font-size: 14px; fill: #765f55; }
      .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#paper)"/>
  <text class="cn eyebrow" x="64" y="48">YAMDROK ROUTE DECISION · 2026-09</text>
  <text class="cn title" x="64" y="92">羊卓雍措怎么走：经典西线留，东岸线删</text>
  <text class="cn subtitle" x="64" y="126">1号＋2号形成完整视角；3号看排队决定。东岸三点不是去日喀则的顺路加点。</text>
