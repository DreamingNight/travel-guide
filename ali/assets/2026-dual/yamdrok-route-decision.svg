    <text class="cn" x="18" y="79" font-size="25" font-weight="790" fill="#174f55">1号 ＋ 2号</text>
    <text class="cn" x="18" y="108" font-size="16" fill="#365f63">3号仅在不排队时加入</text>
    <text class="cn" x="18" y="136" font-size="15" font-weight="720" fill="#a45b2c">删减顺序：3号 → 2号 → 1号</text>
  </g>

