<rect x="55" y="630" width="1080" height="76" rx="10" fill="#e8ede3"/>
<text x="73" y="659" font-size="18" fill="#293d35" text-anchor="start">区域认知：左侧为阿里西端，上方为G317回程，图中灰线是其他攻略的中北线。</text>
<text x="73" y="686" font-size="18" fill="#293d35" text-anchor="start">此图不展示完整道路和所有湖泊；羊湖四点、加乌拉分岔与札达局部另见日卡。</text>
<text x="40" y="738" font-size="16" fill="#6c746d" text-anchor="start">独立重绘 · 仅示意空间与行程关系，不按比例，不是道路导航轨迹。</text>
